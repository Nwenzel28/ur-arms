<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UR3e Program Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0e0e10;
  --surface:   #17171a;
  --surface2:  #1f1f24;
  --border:    #2a2a30;
  --border2:   #3a3a44;
  --text:      #e8e8ec;
  --text2:     #8888a0;
  --text3:     #55556a;
  --accent:    #f97316;
  --accent-lo: #f9731620;
  --accent2:   #fb923c;
  --green:     #22c55e;
  --green-lo:  #22c55e18;
  --red:       #ef4444;
  --red-lo:    #ef444418;
  --blue:      #60a5fa;
  --radius:    6px;
  --radius-lg: 10px;
  --sans:      'IBM Plex Sans', sans-serif;
  --mono:      'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
}

/* ── Header ─────────────────────────────────────────── */
.hdr {
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 0 20px;
  height: 52px;
  display: flex;
  align-items: center;
  gap: 16px;
  position: sticky;
  top: 0;
  z-index: 200;
}
.hdr-brand { display: flex; flex-direction: column; gap: 1px; }
.hdr-title { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: 0.02em; }
.hdr-sub   { font-size: 10px; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; }
.hdr-sep   { width: 1px; height: 24px; background: var(--border); }
.hdr-space { flex: 1; }

.seg {
  display: flex;
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  overflow: hidden;
}
.seg-btn {
  padding: 5px 14px;
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 500;
  border: none;
  background: none;
  color: var(--text2);
  cursor: pointer;
  transition: background 0.15s, color 0.15s;
}
.seg-btn.on { background: var(--accent); color: #fff; }

.btn {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 6px 14px;
  font-family: var(--sans);
  font-size: 12px;
  font-weight: 500;
  border-radius: var(--radius);
  border: 1px solid var(--border2);
  background: var(--surface2);
  color: var(--text);
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.btn:hover { background: var(--border); border-color: var(--border2); }
.btn:disabled { opacity: 0.35; cursor: default; }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-accent:hover { background: var(--accent2); border-color: var(--accent2); }
.btn-ghost { background: none; border-color: transparent; color: var(--text2); padding: 4px 8px; }
.btn-ghost:hover { background: var(--surface2); color: var(--text); }
.btn-del { background: none; border-color: transparent; color: var(--text3); padding: 4px 7px; }
.btn-del:hover { background: var(--red-lo); color: var(--red); }

/* ── Layout ──────────────────────────────────────────── */
.app {
  display: grid;
  grid-template-columns: 400px 1fr;
  gap: 14px;
  padding: 14px 20px;
  max-width: 1360px;
  margin: 0 auto;
}

/* ── Card / Panel ───────────────────────────────────── */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  overflow: hidden;
}
.card-hdr {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  background: var(--surface2);
}
.card-title {
  font-family: var(--mono);
  font-size: 11px;
  font-weight: 600;
  color: var(--text2);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  flex: 1;
}
.card-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; }

/* ── Position cards ─────────────────────────────────── */
.pos-card {
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.15s;
}
.pos-card:hover { border-color: var(--border2); }

.pos-hdr {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  background: var(--surface2);
  border-bottom: 1px solid var(--border);
}
.pos-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--border2);
  flex-shrink: 0;
  transition: background 0.2s;
}
.pos-dot.full { background: var(--green); box-shadow: 0 0 6px var(--green); }

.pos-name {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 4px;
  padding: 2px 6px;
  flex: 1;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}
.pos-name:focus { outline: none; border-color: var(--accent); background: var(--bg); }

.joints {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
  padding: 8px 10px;
}
.jcell { display: flex; flex-direction: column; gap: 3px; }
.jlabel { font-size: 9px; color: var(--text3); text-align: center; font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
.jinput {
  width: 100%;
  text-align: center;
  font-family: var(--mono);
  font-size: 11px;
  padding: 5px 2px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg);
  color: var(--text);
  transition: border-color 0.15s;
}
.jinput:focus { outline: none; border-color: var(--accent); }
.jinput.filled { border-color: #22c55e55; color: var(--green); }

/* ── Settings grid ───────────────────────────────────── */
.settings-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  padding: 12px;
}
.sg { display: flex; flex-direction: column; gap: 4px; }
.sg label { font-size: 10px; color: var(--text3); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
.sg input {
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  font-family: var(--mono);
  font-size: 12px;
  background: var(--bg);
  color: var(--text);
}
.sg input:focus { outline: none; border-color: var(--accent); }

/* ── Steps ───────────────────────────────────────────── */
.steps-body { padding: 10px; display: flex; flex-direction: column; gap: 5px; }

.step {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  transition: border-color 0.15s;
}
.step:hover { border-color: var(--border2); }

.step-n {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--text3);
  min-width: 20px;
  text-align: right;
}
.step-sel, .step-input {
  font-family: var(--mono);
  font-size: 11px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 4px;
  color: var(--text);
  padding: 4px 7px;
  cursor: pointer;
}
.step-sel:focus, .step-input:focus { outline: none; border-color: var(--accent); }
.step-spacer { flex: 1; }

.step-tag {
  font-family: var(--mono);
  font-size: 10px;
  padding: 2px 7px;
  border-radius: 3px;
  background: var(--surface2);
  color: var(--text2);
  border: 1px solid var(--border);
  flex-shrink: 0;
}
.tag-move   { background: var(--accent-lo);  color: var(--accent); border-color: #f9731640; }
.tag-grip   { background: var(--green-lo);   color: var(--green);  border-color: #22c55e40; }
.tag-util   { background: var(--surface2);   color: var(--text2);  border-color: var(--border); }

/* Add step row */
.add-step-row {
  display: flex;
  gap: 6px;
  padding: 10px;
  border-top: 1px solid var(--border);
  align-items: center;
}
.add-step-row select {
  flex: 1;
  font-family: var(--mono);
  font-size: 11px;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  padding: 6px 8px;
}
.add-step-row select:focus { outline: none; border-color: var(--accent); }

/* ── Code output ─────────────────────────────────────── */
.code-wrap {
  padding: 0 20px 20px;
  max-width: 1360px;
  margin: 0 auto;
}
.code-hdr { background: #0a0a0c; }
.code-hdr .card-title { color: var(--accent); }
.code-block {
  font-family: var(--mono);
  font-size: 12px;
  line-height: 1.75;
  padding: 16px;
  background: #07070a;
  color: #c8c8d8;
  overflow-x: auto;
  white-space: pre;
  max-height: 520px;
  overflow-y: auto;
  border-top: 1px solid var(--border);
}
.code-block::-webkit-scrollbar { width: 6px; height: 6px; }
.code-block::-webkit-scrollbar-track { background: #0a0a0c; }
.code-block::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* Syntax colours */
.c-cm  { color: #4a4a64; font-style: italic; }
.c-kw  { color: #c792ea; }
.c-fn  { color: #82aaff; }
.c-str { color: #c3e88d; }
.c-num { color: #f78c6c; }
.c-var { color: var(--accent); }

/* Scrollbar for positions */
.card-body::-webkit-scrollbar { width: 5px; }
.card-body::-webkit-scrollbar-track { background: transparent; }
.card-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* ── Collapse toggle ─────────────────────────────────── */
.collapse-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 10px; padding: 2px 4px; }
.collapse-btn:hover { color: var(--text2); }

/* ── Divider ─────────────────────────────────────────── */
.divider { height: 1px; background: var(--border); margin: 2px 0; }

/* ── Right col layout ────────────────────────────────── */
.right-col { display: flex; flex-direction: column; gap: 14px; }

/* ── Util ────────────────────────────────────────────── */
.row { display: flex; align-items: center; gap: 6px; }
.ml-auto { margin-left: auto; }
</style>
</head>
<body>

<!-- ══ HEADER ══════════════════════════════════════════ -->
<header class="hdr">
  <div class="hdr-brand">
    <div class="hdr-title">UR3e Program Builder</div>
    <div class="hdr-sub">Robotiq 2F-85 · URScript</div>
  </div>
  <div class="hdr-sep"></div>
  <div class="seg">
    <button class="seg-btn on" id="btn-deg" onclick="setMode('deg')">DEG</button>
    <button class="seg-btn"   id="btn-rad" onclick="setMode('rad')">RAD</button>
  </div>
  <div class="hdr-space"></div>
  <button class="btn" onclick="copyCode()">Copy code</button>
  <button class="btn btn-accent" onclick="downloadCode()">↓ Download .script</button>
</header>

<!-- ══ MAIN ════════════════════════════════════════════ -->
<div class="app">

  <!-- LEFT: Positions -->
  <div>
    <div class="card">
      <div class="card-hdr">
        <span class="card-title">Positions</span>
        <button class="btn" onclick="addPosition()">+ Add</button>
      </div>
      <div class="card-body" id="pos-list" style="max-height:calc(100vh - 200px);overflow-y:auto;"></div>
    </div>
  </div>

  <!-- RIGHT: Settings + Steps -->
  <div class="right-col">

    <!-- Settings -->
    <div class="card">
      <div class="card-hdr">
        <span class="card-title">Settings</span>
        <button class="collapse-btn" id="cfg-toggle" onclick="toggleCfg()">▼</button>
      </div>
      <div id="cfg-body">
        <div class="settings-grid">
          <div class="sg">
            <label>Joint speed (rad/s)</label>
            <input type="number" step="0.01" id="cfg-jspeed" value="1.05" oninput="refreshCode()">
          </div>
          <div class="sg">
            <label>Joint accel (rad/s²)</label>
            <input type="number" step="0.01" id="cfg-jaccel" value="1.4" oninput="refreshCode()">
          </div>
          <div class="sg">
            <label>Gripper open (mm)</label>
            <input type="number" step="1"    id="cfg-gopen"  value="25"  oninput="refreshCode()">
          </div>
          <div class="sg">
            <label>Gripper close (mm)</label>
            <input type="number" step="1"    id="cfg-gclose" value="70"  oninput="refreshCode()">
          </div>
          <div class="sg">
            <label>Gripper speed (0–100)</label>
            <input type="number" step="1" min="0" max="100" id="cfg-gspeed" value="100" oninput="refreshCode()">
          </div>
          <div class="sg">
            <label>Gripper force (0–100)</label>
            <input type="number" step="1" min="0" max="100" id="cfg-gforce" value="100" oninput="refreshCode()">
          </div>
        </div>
      </div>
    </div>

    <!-- Program steps -->
    <div class="card">
      <div class="card-hdr">
        <span class="card-title">Program</span>
        <span style="font-size:10px;color:var(--text3);margin-right:4px;" id="step-count">0 steps</span>
      </div>
      <div class="steps-body" id="steps-list"></div>
      <div class="add-step-row">
        <select id="new-type">
          <option value="movej">Move to position</option>
          <option value="open_gripper">Open gripper</option>
          <option value="close_gripper">Close gripper</option>
          <option value="activate_gripper">Activate gripper</option>
          <option value="sleep">Sleep</option>
          <option value="textmsg">Log message</option>
        </select>
        <button class="btn btn-accent" onclick="addStep()">+ Add step</button>
      </div>
    </div>

  </div>
</div>

<!-- ══ CODE OUTPUT ═════════════════════════════════════ -->
<div class="code-wrap">
  <div class="card">
    <div class="card-hdr code-hdr">
      <span class="card-title">Generated URScript</span>
      <span style="font-size:10px;color:var(--text3);" id="code-lines"></span>
    </div>
    <div class="code-block" id="code-out"></div>
  </div>
</div>

<script>
// ══ STATE ═══════════════════════════════════════════════
let mode = 'deg';  // 'deg' | 'rad'
let cfgOpen = true;
let _uid = 0;
function uid() { return 'x' + (_uid++); }

// Joints stored as radians
let positions = [
  { id: uid(), name: 'HOME',     j: [0, -1.5708, 0, -1.5708, 0, 0] },
  { id: uid(), name: 'APPROACH', j: [0, -1.5708, 0, -1.5708, 0, 0] },
  { id: uid(), name: 'PICK',     j: [0, -1.5708, 0, -1.5708, 0, 0] },
  { id: uid(), name: 'PLACE',    j: [0, -1.5708, 0, -1.5708, 0, 0] },
];

let steps = [];

function initSteps() {
  const ids = positions.map(p => p.id);
  steps = [
    { id: uid(), type: 'activate_gripper' },
    { id: uid(), type: 'movej',        pid: ids[0] },
    { id: uid(), type: 'open_gripper' },
    { id: uid(), type: 'movej',        pid: ids[1] },
    { id: uid(), type: 'movej',        pid: ids[2] },
    { id: uid(), type: 'close_gripper' },
    { id: uid(), type: 'movej',        pid: ids[1] },
    { id: uid(), type: 'movej',        pid: ids[3] },
    { id: uid(), type: 'open_gripper' },
    { id: uid(), type: 'movej',        pid: ids[0] },
  ];
}

// ══ ANGLE CONVERSION ════════════════════════════════════
function toDisp(rad) {
  return mode === 'deg' ? +(rad * 180 / Math.PI).toFixed(2) : +rad.toFixed(4);
}
function fromDisp(v) {
  const n = parseFloat(v);
  if (isNaN(n)) return 0;
  return mode === 'deg' ? n * Math.PI / 180 : n;
}

function setMode(m) {
  mode = m;
  document.getElementById('btn-deg').classList.toggle('on', m === 'deg');
  document.getElementById('btn-rad').classList.toggle('on', m === 'rad');
  renderPositions();
  refreshCode();
}

// ══ POSITIONS ═══════════════════════════════════════════
const JNAMES = ['Base', 'Shldr', 'Elbow', 'Wrist1', 'Wrist2', 'Wrist3'];

function posComplete(pos) {
  return pos.j.every(v => v !== 0);
}

function renderPositions() {
  const unit = mode === 'deg' ? '°' : 'r';
  document.getElementById('pos-list').innerHTML = positions.map((pos, pi) => `
    <div class="pos-card" id="pc-${pos.id}">
      <div class="pos-hdr">
        <div class="pos-dot ${posComplete(pos) ? 'full' : ''}" id="dot-${pos.id}"></div>
        <input class="pos-name" value="${pos.name}"
          onchange="renamePos('${pos.id}', this.value)"
          onblur="renamePos('${pos.id}', this.value)" />
        <button class="btn-del btn" onclick="deletePos('${pos.id}')">✕</button>
      </div>
      <div class="joints">
        ${JNAMES.map((name, ji) => `
          <div class="jcell">
            <div class="jlabel">${name}<br>${unit}</div>
            <input class="jinput ${pos.j[ji] !== 0 ? 'filled' : ''}" type="number"
              step="${mode === 'deg' ? '0.1' : '0.0001'}"
              value="${toDisp(pos.j[ji])}"
              onchange="setJoint('${pos.id}', ${ji}, this.value)"
              oninput="liveJoint(this, '${pos.id}', ${ji}, this.value)" />
          </div>
        `).join('')}
      </div>
    </div>
  `).join('');
}

function setJoint(pid, ji, v) {
  const pos = positions.find(p => p.id === pid);
  if (!pos) return;
  pos.j[ji] = fromDisp(v);
  updatePosDot(pid);
  refreshCode();
}

function liveJoint(el, pid, ji, v) {
  el.classList.toggle('filled', v !== '' && v !== '0');
  setJoint(pid, ji, v);
}

function updatePosDot(pid) {
  const pos = positions.find(p => p.id === pid);
  const dot = document.getElementById('dot-' + pid);
  if (dot && pos) dot.className = 'pos-dot' + (posComplete(pos) ? ' full' : '');
}

function renamePos(pid, val) {
  const pos = positions.find(p => p.id === pid);
  if (!pos) return;
  pos.name = val.toUpperCase().replace(/\s+/g, '_').replace(/[^A-Z0-9_]/g, '');
  refreshCode();
  renderSteps();
}

function addPosition() {
  positions.push({ id: uid(), name: 'POS_' + (positions.length + 1), j: [0,0,0,0,0,0] });
  renderPositions();
  renderSteps();
  refreshCode();
}

function deletePos(pid) {
  if (positions.length === 1) return;
  positions = positions.filter(p => p.id !== pid);
  steps = steps.filter(s => s.type !== 'movej' || s.pid !== pid);
  renderPositions();
  renderSteps();
  refreshCode();
}

// ══ SETTINGS ════════════════════════════════════════════
function toggleCfg() {
  cfgOpen = !cfgOpen;
  document.getElementById('cfg-body').style.display = cfgOpen ? '' : 'none';
  document.getElementById('cfg-toggle').textContent = cfgOpen ? '▼' : '▶';
}
function g(id) { return parseFloat(document.getElementById(id).value) || 0; }

// ══ STEPS ═══════════════════════════════════════════════
const TYPE_LABEL = {
  movej:            'Move to position',
  open_gripper:     'Open gripper',
  close_gripper:    'Close gripper',
  activate_gripper: 'Activate gripper',
  sleep:            'Sleep',
  textmsg:          'Log message',
};
const TYPE_TAG = {
  movej:            ['MOVE',   'tag-move'],
  open_gripper:     ['GRIP',   'tag-grip'],
  close_gripper:    ['GRIP',   'tag-grip'],
  activate_gripper: ['GRIP',   'tag-grip'],
  sleep:            ['UTIL',   'tag-util'],
  textmsg:          ['LOG',    'tag-util'],
};

function renderSteps() {
  const posOpts = positions.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
  const list = document.getElementById('steps-list');
  list.innerHTML = steps.map((s, si) => {
    const [tag, tagClass] = TYPE_TAG[s.type];
    const typeOpts = Object.entries(TYPE_LABEL).map(([v, l]) =>
      `<option value="${v}" ${s.type === v ? 'selected' : ''}>${l}</option>`
    ).join('');

    let param = '<span class="step-spacer"></span>';
    if (s.type === 'movej') {
      const opts = positions.map(p => `<option value="${p.id}" ${s.pid === p.id ? 'selected' : ''}>${p.name}</option>`).join('');
      param = `<select class="step-sel" onchange="updateStepPid('${s.id}',this.value)">${opts}</select><span class="step-spacer"></span>`;
    } else if (s.type === 'sleep') {
      param = `<input class="step-input" type="number" min="0" step="0.1" value="${s.sec ?? 1}" style="width:70px"
        onchange="updateStepSec('${s.id}',this.value)"><span style="font-size:10px;color:var(--text3);margin-left:2px">sec</span><span class="step-spacer"></span>`;
    } else if (s.type === 'textmsg') {
      param = `<input class="step-input" type="text" value="${esc(s.msg ?? '')}" style="flex:1"
        placeholder="message..." onchange="updateStepMsg('${s.id}',this.value)">`;
    }

    return `<div class="step" id="st-${s.id}">
      <span class="step-n">${si + 1}</span>
      <span class="step-tag ${tagClass}">${tag}</span>
      <select class="step-sel" onchange="updateStepType('${s.id}',this.value)">${typeOpts}</select>
      ${param}
      <button class="btn-ghost btn" onclick="moveStep('${s.id}',-1)" ${si===0?'disabled':''}>↑</button>
      <button class="btn-ghost btn" onclick="moveStep('${s.id}',1)"  ${si===steps.length-1?'disabled':''}>↓</button>
      <button class="btn-del btn"   onclick="deleteStep('${s.id}')">✕</button>
    </div>`;
  }).join('');

  document.getElementById('step-count').textContent = steps.length + ' step' + (steps.length !== 1 ? 's' : '');
}

function addStep() {
  const type = document.getElementById('new-type').value;
  const s = { id: uid(), type };
  if (type === 'movej') s.pid = positions[0]?.id ?? null;
  if (type === 'sleep') s.sec = 1;
  if (type === 'textmsg') s.msg = '';
  steps.push(s);
  renderSteps();
  refreshCode();
}

function deleteStep(sid) {
  steps = steps.filter(s => s.id !== sid);
  renderSteps();
  refreshCode();
}

function moveStep(sid, dir) {
  const i = steps.findIndex(s => s.id === sid);
  const j = i + dir;
  if (j < 0 || j >= steps.length) return;
  [steps[i], steps[j]] = [steps[j], steps[i]];
  renderSteps();
  refreshCode();
}

function updateStepType(sid, type) {
  const s = steps.find(x => x.id === sid);
  if (!s) return;
  s.type = type;
  if (type === 'movej' && !s.pid) s.pid = positions[0]?.id ?? null;
  if (type === 'sleep' && !s.sec) s.sec = 1;
  if (type === 'textmsg' && s.msg == null) s.msg = '';
  renderSteps();
  refreshCode();
}

function updateStepPid(sid, pid) { const s=steps.find(x=>x.id===sid); if(s){s.pid=pid;refreshCode();} }
function updateStepSec(sid, v)   { const s=steps.find(x=>x.id===sid); if(s){s.sec=parseFloat(v);refreshCode();} }
function updateStepMsg(sid, v)   { const s=steps.find(x=>x.id===sid); if(s){s.msg=v;refreshCode();} }

// ══ CODE GENERATION ═════════════════════════════════════
function buildCode() {
  const T = '    ';
  const jspeed = g('cfg-jspeed'), jaccel = g('cfg-jaccel');
  const gopen  = g('cfg-gopen'),  gclose = g('cfg-gclose');
  const gspeed = g('cfg-gspeed'), gforce = g('cfg-gforce');
  const L = [];

  L.push('# =================================================================');
  L.push('# UR3e Program — Generated by UR3e Program Builder');
  L.push('# =================================================================');
  L.push('');
  L.push('# Motion parameters');
  L.push(`JOINT_SPEED = ${jspeed}`);
  L.push(`JOINT_ACCEL = ${jaccel}`);
  L.push('');
  L.push('# Gripper parameters');
  L.push(`GRIPPER_SPEED    = ${gspeed}`);
  L.push(`GRIPPER_FORCE    = ${gforce}`);
  L.push(`GRIPPER_OPEN_MM  = ${gopen}`);
  L.push(`GRIPPER_CLOSE_MM = ${gclose}`);
  L.push('');
  L.push('# Positions (radians)');
  positions.forEach(pos => {
    const vals = pos.j.map(v => v.toFixed(4)).join(', ');
    L.push(`${pos.name} = [${vals}]`);
  });
  L.push('');
  L.push('# =================================================================');
  L.push('# Gripper functions');
  L.push('# =================================================================');
  L.push('');
  L.push('def activate_gripper():');
  L.push(`${T}textmsg("Activating gripper...")`);
  L.push(`${T}rq_activate_and_wait()`);
  L.push(`${T}textmsg("Gripper ready")`);
  L.push('end');
  L.push('');
  L.push('def open_gripper():');
  L.push(`${T}textmsg("Opening gripper")`);
  L.push(`${T}rq_set_speed_norm(GRIPPER_SPEED)`);
  L.push(`${T}rq_set_force_norm(GRIPPER_FORCE)`);
  L.push(`${T}rq_move_and_wait_norm(GRIPPER_OPEN_MM)`);
  L.push(`${T}sleep(0.5)`);
  L.push('end');
  L.push('');
  L.push('def close_gripper():');
  L.push(`${T}textmsg("Closing gripper")`);
  L.push(`${T}rq_set_speed_norm(GRIPPER_SPEED)`);
  L.push(`${T}rq_set_force_norm(GRIPPER_FORCE)`);
  L.push(`${T}rq_move_and_wait_norm(GRIPPER_CLOSE_MM)`);
  L.push(`${T}sleep(0.5)`);
  L.push('end');
  L.push('');
  L.push('# =================================================================');
  L.push('# Main program');
  L.push('# =================================================================');
  L.push('');
  L.push('def main():');
  L.push(`${T}textmsg("=== Program Start ===")`);
  steps.forEach(s => {
    if (s.type === 'movej') {
      const pos = positions.find(p => p.id === s.pid);
      L.push(`${T}movej(${pos ? pos.name : 'UNKNOWN'}, a=JOINT_ACCEL, v=JOINT_SPEED)`);
    } else if (s.type === 'open_gripper')     { L.push(`${T}open_gripper()`); }
    else if (s.type === 'close_gripper')      { L.push(`${T}close_gripper()`); }
    else if (s.type === 'activate_gripper')   { L.push(`${T}activate_gripper()`); }
    else if (s.type === 'sleep')              { L.push(`${T}sleep(${s.sec ?? 1})`); }
    else if (s.type === 'textmsg')            { L.push(`${T}textmsg("${s.msg ?? ''}")`); }
  });
  L.push(`${T}textmsg("=== Program Complete ===")`);
  L.push('end');
  L.push('');
  L.push('main()');

  return L.join('\n');
}

// ── Syntax highlighter ──────────────────────────────────
const KW  = /\b(def|end|if|else|while|return|True|False|not|and|or)\b/g;
const FNS = /\b(movej|movel|sleep|textmsg|rq_activate_and_wait|rq_set_speed_norm|rq_set_force_norm|rq_move_and_wait_norm|rq_move_and_wait|open_gripper|close_gripper|activate_gripper|main)\b/g;
const NUM = /\b(\d+\.?\d*)\b/g;

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function highlight(code) {
  return code.split('\n').map(line => {
    const e = esc(line);
    // Full comment line
    if (/^\s*#/.test(e)) return `<span class="c-cm">${e}</span>`;

    // Split at inline comment (crude but works for URScript)
    let code2 = e, comment = '';
    const ci = e.indexOf('#');
    if (ci > 0) { code2 = e.slice(0, ci); comment = e.slice(ci); }

    // Strings — replace first to protect content
    const strMap = {};
    let si = 0;
    code2 = code2.replace(/"([^"]*)"/g, (_, inner) => {
      const key = `\x00S${si++}\x00`;
      strMap[key] = `<span class="c-str">"${inner}"</span>`;
      return key;
    });

    code2 = code2
      .replace(NUM, (m, n) => `<span class="c-num">${n}</span>`)
      .replace(KW,  m => `<span class="c-kw">${m}</span>`)
      .replace(FNS, m => `<span class="c-fn">${m}</span>`);

    // Restore strings
    Object.entries(strMap).forEach(([k, v]) => { code2 = code2.replace(k, v); });

    if (comment) code2 += `<span class="c-cm">${comment}</span>`;
    return code2;
  }).join('\n');
}

function refreshCode() {
  const plain = buildCode();
  const lines = plain.split('\n').length;
  document.getElementById('code-out').innerHTML = highlight(plain);
  document.getElementById('code-lines').textContent = lines + ' lines';
}

// ── Copy / Download ─────────────────────────────────────
function copyCode() {
  navigator.clipboard.writeText(buildCode()).then(() => {
    const b = document.querySelector('.hdr .btn');
    const orig = b.textContent;
    b.textContent = '✓ Copied!';
    setTimeout(() => b.textContent = orig, 1800);
  });
}

function downloadCode() {
  const blob = new Blob([buildCode()], { type: 'text/plain' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = 'ur3e_program.script'; a.click();
  URL.revokeObjectURL(url);
}

// ══ BOOT ════════════════════════════════════════════════
initSteps();
renderPositions();
renderSteps();
refreshCode();
</script>
