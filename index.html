<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UR3e Program Builder</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="app">
    <div class="side">
      <div class="hdr" style="border-bottom: 1px solid var(--bd);">
        <div class="title">Robot Control Panel</div>
      </div>
      
      <div style="padding: 12px; border-bottom: 1px solid var(--bd); display: flex; flex-direction: column; gap: 8px;">
        <div style="display: flex; gap: 8px;">
          <input type="text" id="robot-ip" class="input" placeholder="Robot IP (e.g. 192.168.1.100)" value="192.168.1.50" style="flex:1">
          <select id="units-select" class="input" style="width: 75px; background: var(--sf2);" onchange="refreshDisplay()">
            <option value="DEG" selected>DEG</option>
            <option value="RAD">RAD</option>
          </select>
        </div>
        <div style="display: flex; gap: 8px;">
          <button id="btn-fd" class="btn btn-ghost" style="flex:1" onclick="toggleFreedrive()">Enable Freedrive</button>
        </div>
      </div>

      <div style="padding: 10px; background: var(--bg); border-bottom: 1px solid var(--bd); font-family: var(--mono); font-size: 10px; display: flex; flex-direction: column; gap: 8px;">
        
        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
          <span style="color:var(--ac); font-weight:bold; width: 28px;">TCP:</span>
          <div><span style="color:var(--tx2)">X:</span> <span id="live-x">0.0000</span></div>
          <div><span style="color:var(--tx2)">Y:</span> <span id="live-y">0.0000</span></div>
          <div><span style="color:var(--tx2)">Z:</span> <span id="live-z">0.0000</span></div>
          <div><span style="color:var(--tx2)">Rx:</span> <span id="live-rx">0.0000</span></div>
          <div><span style="color:var(--tx2)">Ry:</span> <span id="live-ry">0.0000</span></div>
          <div><span style="color:var(--tx2)">Rz:</span> <span id="live-rz">0.0000</span></div>
          <button class="btn btn-sm btn-ghost" onclick="fetchRobotState()" style="margin-left: auto; padding: 2px 6px;">↻ Refresh</button>
        </div>

        <div style="display: flex; gap: 8px; align-items: center; flex-wrap: wrap;">
          <span style="color:var(--ac); font-weight:bold; width: 28px;">JNT:</span>
          <div><span style="color:var(--tx2)">Base:</span> <span id="live-j0">0.0000</span></div>
          <div><span style="color:var(--tx2)">Shld:</span> <span id="live-j1">0.0000</span></div>
          <div><span style="color:var(--tx2)">Elbw:</span> <span id="live-j2">0.0000</span></div>
          <div><span style="color:var(--tx2)">Wst1:</span> <span id="live-j3">0.0000</span></div>
          <div><span style="color:var(--tx2)">Wst2:</span> <span id="live-j4">0.0000</span></div>
          <div><span style="color:var(--tx2)">Wst3:</span> <span id="live-j5">0.0000</span></div>
        </div>
      </div>

      <div style="padding: 12px; border-bottom: 1px solid var(--bd); background: #131316;">
        <div style="font-size: 11px; font-weight: 500; color: var(--tx2); margin-bottom: 8px; display:flex; justify-content:space-between; align-items:center;">
          <span>MANUAL JOGGING (TCP SPACE)</span>
          <div style="display:flex; align-items:center; gap:4px;">
            <span style="font-size:10px;">Step:</span>
            <input type="number" id="jog-step" class="input" value="10" style="width:50px; padding:2px 4px; height:20px; font-size:10px; text-align:center;">
            <span style="font-size:10px; color:var(--tx3)">mm</span>
          </div>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 6px;">
          <button class="btn btn-sm btn-ghost" onclick="jog('X', 1)">X +</button>
          <button class="btn btn-sm btn-ghost" onclick="jog('Y', 1)">Y +</button>
          <button class="btn btn-sm btn-ghost" onclick="jog('Z', 1)">Z +</button>
          <button class="btn btn-sm btn-ghost" onclick="jog('X', -1)">X -</button>
          <button class="btn btn-sm btn-ghost" onclick="jog('Y', -1)">Y -</button>
          <button class="btn btn-sm btn-ghost" onclick="jog('Z', -1)">Z -</button>
        </div>
        
        <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;">
          <button class="btn btn-sm btn-ghost" style="color:var(--pu)" onclick="jog('Rx', 1)">Rx +</button>
          <button class="btn btn-sm btn-ghost" style="color:var(--pu)" onclick="jog('Ry', 1)">Ry +</button>
          <button class="btn btn-sm btn-ghost" style="color:var(--pu)" onclick="jog('Rz', 1)">Rz +</button>
          <button class="btn btn-sm btn-ghost" style="color:var(--pu)" onclick="jog('Rx', -1)">Rx -</button>
          <button class="btn btn-sm btn-ghost" style="color:var(--pu)" onclick="jog('Ry', -1)">Ry -</button>
          <button class="btn btn-sm btn-ghost" style="color:var(--pu)" onclick="jog('Rz', -1)">Rz -</button>
        </div>
      </div>

      <div style="padding: 12px; border-bottom: 1px solid var(--bd); background: var(--sf); display: flex; flex-direction: column; gap: 10px;">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div>
            <label class="lbl">Movement Profile</label>
            <select id="param-type" class="input">
              <option value="movej" selected>MoveJ (Joint-space)</option>
              <option value="movel">MoveL (Linear-space)</option>
            </select>
          </div>
          <div>
            <label class="lbl">Target Blend Radius</label>
            <div style="display: flex; align-items: center; position: relative;">
              <input type="number" id="param-blend" class="input" value="0" step="5">
              <span style="position: absolute; right: 8px; font-size: 11px; color: var(--tx3); pointer-events: none;">mm</span>
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div>
            <label class="lbl">Tool Joint Speed</label>
            <div style="display: flex; align-items: center; position: relative;">
              <input type="number" id="param-speed" class="input" value="1.0" step="0.1">
              <span id="unit-speed" class="position-unit">rad/s</span>
            </div>
          </div>
          <div>
            <label class="lbl">Tool Acceleration</label>
            <div style="display: flex; align-items: center; position: relative;">
              <input type="number" id="param-accel" class="input" value="1.4" step="0.1">
              <span id="unit-accel" class="position-unit">rad/s²</span>
            </div>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px;">
          <button class="btn btn-ghost" onclick="recordLivePosition()" style="border-color: var(--bl); color: var(--bl);">➕ Record Live</button>
          <button class="btn" onclick="addWaypoint()">Add Custom</button>
        </div>
      </div>

      <div class="pos-list" id="pos-list"></div>
    </div>

    <div class="main">
      <div class="hdr" style="border-bottom: 1px solid var(--bd);">
        <div class="title">Generated URScript Code Output</div>
        <div id="code-lines" style="font-size: 11px; color: var(--tx3); font-family: var(--mono);">0 lines</div>
        <div style="flex:1"></div>
        <button class="btn btn-ghost" style="padding: 4px 10px; font-size: 11px;" onclick="copyCode()">Copy Code</button>
        <button class="btn" style="padding: 4px 12px; font-size: 11px; background: var(--gn); border-color: var(--gn);" onclick="runProgram()">🚀 Run on Robot</button>
      </div>
      <div class="editor-wrap">
        <div class="editor-scroller">
          <pre id="code-out" class="code-block"></pre>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
