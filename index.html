<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UR3e Program Builder V3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0e0e10;
  --surface:   #17171a;
  --surface2:  #1f1f24;
  --border:    #2a2a30;
  --border2:   #3a3a44;
  --text:      #e8e8ec;
  --text2:     #8888a0;
  --text3:     #55556a;
  
  /* Reverted to Orange */
  --accent:    #f97316;
  --accent-lo: #f9731620;
  --accent2:   #fb923c;
  
  --green:     #22c55e;
  --green-lo:  #22c55e18;
  --red:       #ef4444;
  --red-lo:    #ef444418;
  --blue:      #3b82f6;
  --blue-lo:   #3b82f618;
  --purple:    #c084fc;
  --purple-lo: #c084fc18;
  --yellow:    #eab308;
  --yellow-lo: #eab30818;
  
  --radius:    6px;
  --radius-lg: 10px;
  --sans:      'IBM Plex Sans', sans-serif;
  --mono:      'JetBrains Mono', monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }

body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  line-height: 1.5;
}

/* ── Header ─────────────────────────────────────────── */
.hdr { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 20px; height: 52px; display: flex; align-items: center; gap: 16px; position: sticky; top: 0; z-index: 200; }
.hdr-brand { display: flex; flex-direction: column; gap: 1px; }
.hdr-title { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); letter-spacing: 0.02em; }
.hdr-sub   { font-size: 10px; color: var(--text3); letter-spacing: 0.05em; text-transform: uppercase; }
.hdr-sep   { width: 1px; height: 24px; background: var(--border); }
.hdr-space { flex: 1; }

.seg { display: flex; border: 1px solid var(--border2); border-radius: var(--radius); overflow: hidden; }
.seg-btn { padding: 5px 14px; font-family: var(--mono); font-size: 11px; font-weight: 500; border: none; background: none; color: var(--text2); cursor: pointer; transition: background 0.15s, color 0.15s; }
.seg-btn.on { background: var(--accent); color: #fff; }

.btn { display: inline-flex; align-items: center; gap: 5px; padding: 6px 14px; font-family: var(--sans); font-size: 12px; font-weight: 500; border-radius: var(--radius); border: 1px solid var(--border2); background: var(--surface2); color: var(--text); cursor: pointer; transition: background 0.15s, border-color 0.15s; white-space: nowrap; }
.btn:hover { background: var(--border); border-color: var(--border2); }
.btn-accent { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-accent:hover { background: var(--accent2); border-color: var(--accent2); }
.btn-ghost { background: none; border-color: transparent; color: var(--text2); padding: 4px 8px; }
.btn-ghost:hover { background: var(--surface2); color: var(--text); }
.btn-del { background: none; border-color: transparent; color: var(--text3); padding: 4px 7px; }
.btn-del:hover { background: var(--red-lo); color: var(--red); }
.btn-sm { padding: 4px 8px; font-size: 11px; }

/* ── Layout ──────────────────────────────────────────── */
.app { display: grid; grid-template-columns: 420px 1fr; gap: 14px; padding: 14px 20px; max-width: 1400px; margin: 0 auto; }
.left-col { display: flex; flex-direction: column; gap: 14px; }
.right-col { display: flex; flex-direction: column; gap: 14px; }

/* ── Card / Panel ───────────────────────────────────── */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; }
.card-hdr { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--surface2); }
.card-title { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--text2); letter-spacing: 0.08em; text-transform: uppercase; flex: 1; }
.card-body { padding: 12px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }

/* ── Position cards ─────────────────────────────────── */
.pos-card, .var-card { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; transition: border-color 0.15s; background: var(--bg); }
.pos-card:hover, .var-card:hover { border-color: var(--border2); }
.pos-hdr { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border-bottom: 1px solid var(--border); }
.pos-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border2); flex-shrink: 0; transition: background 0.2s; }
.pos-dot.full { background: var(--green); box-shadow: 0 0 6px var(--green); }

.pos-name, .var-input { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--accent); background: transparent; border: 1px solid transparent; border-radius: 4px; padding: 2px 6px; flex: 1; }
.var-val { color: var(--text); font-weight: 400; width: 80px; border: 1px solid var(--border); }
.pos-name:focus, .var-input:focus { outline: none; border-color: var(--accent); background: var(--bg); }

.joints { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; padding: 8px 10px; }
.jcell { display: flex; flex-direction: column; gap: 3px; }
.jlabel { font-size: 9px; color: var(--text3); text-align: center; font-family: var(--mono); text-transform: uppercase; }
.jinput { width: 100%; text-align: center; font-family: var(--mono); font-size: 11px; padding: 5px 2px; border: 1px solid var(--border); border-radius: 4px; background: var(--surface); color: var(--text); }
.jinput:focus { outline: none; border-color: var(--accent); }
.jinput.filled { border-color: #22c55e55; color: var(--green); }

/* ── Settings grid ───────────────────────────────────── */
.settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; }
.sg { display: flex; flex-direction: column; gap: 4px; }
.sg label { font-size: 10px; color: var(--text3); font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
.sg input { padding: 6px 8px; border: 1px solid var(--border); border-radius: var(--radius); font-family: var(--mono); font-size: 12px; background: var(--bg); color: var(--text); }
.sg input:focus { outline: none; border-color: var(--accent); }

/* ── Steps ───────────────────────────────────────────── */
.steps-body { padding: 10px; display: flex; flex-direction: column; gap: 5px; }
.step { display: flex; align-items: center; gap: 6px; padding: 7px 10px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--bg); transition: border-color 0.15s, margin-left 0.2s ease; }
.step:hover { border-color: var(--border2); }
.step.block-end { border-top-style: dashed; opacity: 0.8; }

.step-n { font-family: var(--mono); font-size: 10px; color: var(--text3); min-width: 20px; text-align: right; }
.step-sel, .step-input { font-family: var(--mono); font-size: 11px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text); padding: 4px 7px; cursor: pointer; }
.step-input { cursor: text; }
.step-sel:focus, .step-input:focus { outline: none; border-color: var(--accent); }
.step-spacer { flex: 1; }
.step-label { font-size: 11px; color: var(--text2); }

.step-tag { font-family: var(--mono); font-size: 10px; padding: 2px 7px; border-radius: 3px; background: var(--surface2); color: var(--text2); border: 1px solid var(--border); flex-shrink: 0; width: 44px; text-align: center; }
.tag-move   { background: var(--accent-lo);  color: var(--accent); border-color: #f9731640; }
.tag-grip   { background: var(--green-lo);   color: var(--green);  border-color: #22c55e40; }
.tag-util   { background: var(--surface2);   color: var(--text2);  border-color: var(--border); }
.tag-flow   { background: var(--purple-lo);  color: var(--purple); border-color: #c084fc40; }
.tag-io     { background: var(--blue-lo);    color: var(--blue);   border-color: #3b82f640; }
.tag-var    { background: var(--yellow-lo);  color: var(--yellow); border-color: #eab30840; }

.add-step-row { display: flex; gap: 6px; padding: 10px; border-top: 1px solid var(--border); align-items: center; background: var(--surface2); }
.add-step-row select { flex: 1; font-family: var(--mono); font-size: 11px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius); color: var(--text); padding: 6px 8px; }
.add-step-row select:focus { outline: none; border-color: var(--accent); }

.template-row { padding: 10px 14px; display: flex; gap: 8px; border-bottom: 1px solid var(--border); background: var(--bg); align-items: center;}
.template-row .card-title { flex: none; margin-right: 10px; }

/* ── Code output ─────────────────────────────────────── */
.code-wrap { padding: 0 20px 20px; max-width: 1400px; margin: 0 auto; }
.code-hdr { background: #0a0a0c; }
.code-hdr .card-title { color: var(--accent); }
.code-block { font-family: var(--mono); font-size: 12px; line-height: 1.75; padding: 16px; background: #07070a; color: #c8c8d8; overflow-x: auto; white-space: pre; max-height: 520px; overflow-y: auto; border-top: 1px solid var(--border); }
.code-block::-webkit-scrollbar { width: 6px; height: 6px; }
.code-block::-webkit-scrollbar-track { background: #0a0a0c; }
.code-block::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

/* Syntax colours */
.c-cm  { color: #6b7280; font-style: italic; }
.c-kw  { color: #c792ea; }
.c-fn  { color: #82aaff; }
.c-str { color: #c3e88d; }
.c-num { color: #f78c6c; }
.c-var { color: #ffcb6b; }

.card-body::-webkit-scrollbar { width: 5px; }
.card-body::-webkit-scrollbar-track { background: transparent; }
.card-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.collapse-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 10px; padding: 2px 4px; }
.collapse-btn:hover { color: var(--text2); }
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-brand">
    <div class="hdr-title">UR3e Program Builder V3</div>
    <div class="hdr-sub">Robotiq 2F-85 · URScript</div>
  </div>
  <div class="hdr-sep"></div>
  <div class="seg">
    <button class="seg-btn on" id="btn-deg" onclick="setMode('deg')">DEG</button>
    <button class="seg-btn"    id="btn-rad" onclick="setMode('rad')">RAD</button>
  </div>
  <div class="hdr-space"></div>
  <button class="btn" onclick="copyCode()">Copy code</button>
  <button class="btn btn-accent" onclick="downloadCode()">↓ Download .script</button>
</header>

<div class="app">
  <div class="left-col">
    <div class="card" style="flex: 1; max-height: 60vh;">
      <div class="card-hdr">
        <span class="card-title">Positions</span>
        <button class="btn" onclick="addPosition()">+ Add New</button>
      </div>
      <div class="card-body" id="pos-list"></div>
    </div>
    
    <div class="card" style="flex: 0 0 auto;">
      <div class="card-hdr">
        <span class="card-title">Variables</span>
        <button class="btn" onclick="addVariable()">+ Add New</button>
      </div>
      <div class="card-body" id="var-list" style="max-height: 250px;"></div>
    </div>
  </div>

  <div class="right-col">
    <div class="card">
      <div class="card-hdr">
        <span class="card-title">Robot Settings</span>
        <button class="collapse-btn" id="cfg-toggle" onclick="toggleCfg()">▼</button>
      </div>
      <div id="cfg-body">
        <div class="settings-grid">
          <div class="sg"><label>Joint speed (rad/s)</label><input type="number" step="0.01" id="cfg-jspeed" value="1.05" oninput="refreshCode()"></div>
          <div class="sg"><label>Joint accel (rad/s²)</label><input type="number" step="0.01" id="cfg-jaccel" value="1.4" oninput="refreshCode()"></div>
          <div class="sg"><label>Gripper open (mm)</label><input type="number" step="1" id="cfg-gopen" value="25" oninput="refreshCode()"></div>
          <div class="sg"><label>Gripper close (mm)</label><input type="number" step="1" id="cfg-gclose" value="70" oninput="refreshCode()"></div>
          <div class="sg"><label>Gripper speed (0–100)</label><input type="number" step="1" min="0" max="100" id="cfg-gspeed" value="100" oninput="refreshCode()"></div>
          <div class="sg"><label>Gripper force (0–100)</label><input type="number" step="1" min="0" max="100" id="cfg-gforce" value="100" oninput="refreshCode()"></div>
        </div>
      </div>
    </div>

    <div class="card" style="flex:1;">
      <div class="card-hdr">
        <span class="card-title">Program Sequence</span>
        <span style="font-size:10px;color:var(--text3);margin-right:4px;" id="step-count">0 steps</span>
      </div>
      
      <div class="template-row">
        <span class="card-title">Quick Templates:</span>
        <button class="btn btn-sm" onclick="loadTemplate('pick_place')">Pick & Place</button>
        <button class="btn btn-sm" onclick="loadTemplate('pallet_loop')">Basic Loop</button>
        <div class="hdr-sep" style="height: 14px; margin: 0 4px;"></div>
        <button class="btn btn-sm btn-del" onclick="loadTemplate('clear')">Clear All</button>
      </div>

      <div class="steps-body" id="steps-list" style="overflow-y:auto; max-height: 45vh;"></div>
      
      <div class="add-step-row">
        <select id="new-type">
          <optgroup label="Motion">
            <option value="movej">Move Joint (movej)</option>
            <option value="movel">Move Linear (movel)</option>
            <option value="movec">Move Circular Arc (movec)</option>
          </optgroup>
          <optgroup label="Logic & Flow">
            <option value="loop_start">Loop (Repeat N times)</option>
            <option value="if_di">If Digital Input</option>
            <option value="end_block">End Loop / If Block</option>
          </optgroup>
          <optgroup label="I/O & Variables">
            <option value="wait_di">Wait for Digital Input</option>
            <option value="set_do">Set Digital Output</option>
            <option value="assign_var">Assign Variable</option>
          </optgroup>
          <optgroup label="Gripper">
            <option value="open_gripper">Open gripper</option>
            <option value="close_gripper">Close gripper</option>
            <option value="activate_gripper">Activate gripper</option>
          </optgroup>
          <optgroup label="Utility">
            <option value="sleep">Sleep</option>
            <option value="comment">Comment</option>
            <option value="textmsg">Log message</option>
            <option value="popup">Popup message</option>
            <option value="set_payload">Set Payload (kg)</option>
          </optgroup>
        </select>
        <button class="btn btn-accent" onclick="addStep()">+ Add step</button>
      </div>
    </div>
  </div>
</div>

<div class="code-wrap">
  <div class="card">
    <div class="card-hdr code-hdr">
      <span class="card-title">Generated URScript</span>
      <span style="font-size:10px;color:var(--text3);" id="code-lines"></span>
    </div>
    <div class="code-block" id="code-out"></div>
  </div>
</div>

<script>
// ══ STATE ═══════════════════════════════════════════════
let mode = 'deg';  
let cfgOpen = true;
let _uid = 0;
function uid() { return 'x' + (_uid++); }

// Start completely empty to encourage template usage
let positions = [];
let variables = [];
let steps = [];

// ══ AUTOMATION TEMPLATES ════════════════════════════════
function loadTemplate(type) {
  if (!confirm("This will replace your current program. Continue?")) return;
  
  steps = [];
  
  if (type === 'clear') {
    positions = [];
    variables = [];
  } 
  else if (type === 'pick_place') {
    positions = [
      { id: uid(), name: 'HOME',     j: [0, -1.5708, 0, -1.5708, 0, 0] },
      { id: uid(), name: 'APPROACH', j: [0.5, -1.57, 0.5, -1.57, 0, 0] },
      { id: uid(), name: 'PICK',     j: [0.5, -1.2, 0.8, -1.57, 0, 0] },
      { id: uid(), name: 'PLACE',    j: [-0.5, -1.2, 0.8, -1.57, 0, 0] }
    ];
    variables = [{ id: uid(), name: 'parts_moved', val: '0' }];
    
    const p = positions.map(x => x.id);
    const v = variables[0].id;
    
    steps = [
      { id: uid(), type: 'comment', msg: 'Standard Pick and Place Cycle' },
      { id: uid(), type: 'activate_gripper' },
      { id: uid(), type: 'movej', pid: p[0] },
      { id: uid(), type: 'open_gripper' },
      { id: uid(), type: 'movel', pid: p[1] },
      { id: uid(), type: 'movel', pid: p[2] },
      { id: uid(), type: 'close_gripper' },
      { id: uid(), type: 'movel', pid: p[1] },
      { id: uid(), type: 'movel', pid: p[3] },
      { id: uid(), type: 'open_gripper' },
      { id: uid(), type: 'assign_var', varId: v, expr: 'parts_moved + 1' },
      { id: uid(), type: 'movej', pid: p[0] }
    ];
  }
  else if (type === 'pallet_loop') {
    positions = [
      { id: uid(), name: 'START', j: [0, -1.5708, 0, -1.5708, 0, 0] },
      { id: uid(), name: 'DROP',  j: [0.5, -1.2, 0.8, -1.57, 0, 0] }
    ];
    variables = [];
    const p = positions.map(x => x.id);
    
    steps = [
      { id: uid(), type: 'comment', msg: 'Repeating Drop Cycle' },
      { id: uid(), type: 'loop_start', iters: 5 },
      { id: uid(), type: 'movej', pid: p[0] },
      { id: uid(), type: 'movel', pid: p[1] },
      { id: uid(), type: 'open_gripper' },
      { id: uid(), type: 'sleep', sec: 0.5 },
      { id: uid(), type: 'close_gripper' },
      { id: uid(), type: 'end_block' },
      { id: uid(), type: 'movej', pid: p[0] }
    ];
  }

  renderPositions();
  renderVariables();
  renderSteps();
  refreshCode();
}

function quickAddMove(pid) {
  const s = { id: uid(), type: 'movej', pid: pid };
  steps.push(s);
  renderSteps();
  refreshCode();
  // Scroll to bottom of steps
  const list = document.getElementById('steps-list');
  list.scrollTop = list.scrollHeight;
}

// ══ UI CONVERSIONS ══════════════════════════════════════
function toDisp(rad) { return mode === 'deg' ? +(rad * 180 / Math.PI).toFixed(2) : +rad.toFixed(4); }
function fromDisp(v) { const n = parseFloat(v); if (isNaN(n)) return 0; return mode === 'deg' ? n * Math.PI / 180 : n; }

function setMode(m) {
  mode = m;
  document.getElementById('btn-deg').classList.toggle('on', m === 'deg');
  document.getElementById('btn-rad').classList.toggle('on', m === 'rad');
  renderPositions();
  refreshCode();
}

// ══ POSITIONS ═══════════════════════════════════════════
const JNAMES = ['Base', 'Shldr', 'Elbow', 'Wrist1', 'Wrist2', 'Wrist3'];
function posComplete(pos) { return pos.j.every(v => v !== 0); }

function renderPositions() {
  const list = document.getElementById('pos-list');
  if (positions.length === 0) {
    list.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text3); font-style: italic;">No positions defined. Add one or load a template.</div>`;
    return;
  }

  list.innerHTML = positions.map(pos => `
    <div class="pos-card" id="pc-${pos.id}">
      <div class="pos-hdr">
        <div class="pos-dot ${posComplete(pos) ? 'full' : ''}" id="dot-${pos.id}"></div>
        <input class="pos-name" value="${pos.name}" onchange="renamePos('${pos.id}', this.value)">
        <button class="btn btn-sm" onclick="quickAddMove('${pos.id}')" title="Add a Move step to this position">↳ Add Move</button>
        <button class="btn-del btn" onclick="deletePos('${pos.id}')">✕</button>
      </div>
      <div class="joints">
        ${JNAMES.map((name, ji) => `
          <div class="jcell">
            <div class="jlabel">${name}</div>
            <input class="jinput ${pos.j[ji] !== 0 ? 'filled' : ''}" type="number" step="${mode === 'deg' ? '0.1' : '0.0001'}"
              value="${toDisp(pos.j[ji])}" onchange="setJoint('${pos.id}', ${ji}, this.value)" oninput="this.classList.toggle('filled', this.value !== '' && this.value !== '0')">
          </div>
        `).join('')}
      </div>
    </div>`).join('');
}

function setJoint(pid, ji, v) {
  const pos = positions.find(p => p.id === pid);
  if (pos) { pos.j[ji] = fromDisp(v); updatePosDot(pid); refreshCode(); }
}
function updatePosDot(pid) {
  const pos = positions.find(p => p.id === pid);
  const dot = document.getElementById('dot-' + pid);
  if (dot && pos) dot.className = 'pos-dot' + (posComplete(pos) ? ' full' : '');
}
function renamePos(pid, val) {
  const pos = positions.find(p => p.id === pid);
  if (pos) { pos.name = val.toUpperCase().replace(/\s+/g, '_').replace(/[^A-Z0-9_]/g, ''); refreshCode(); renderSteps(); }
}
function addPosition() {
  positions.push({ id: uid(), name: 'POS_' + (positions.length + 1), j: [0,0,0,0,0,0] });
  renderPositions(); renderSteps(); refreshCode();
}
function deletePos(pid) {
  positions = positions.filter(p => p.id !== pid);
  steps = steps.filter(s => s.pid !== pid && s.pid2 !== pid);
  renderPositions(); renderSteps(); refreshCode();
}

// ══ VARIABLES ═══════════════════════════════════════════
function renderVariables() {
  const list = document.getElementById('var-list');
  if (variables.length === 0) {
    list.innerHTML = `<div style="text-align:center; padding: 10px; color: var(--text3); font-style: italic;">No variables defined.</div>`;
    return;
  }
  list.innerHTML = variables.map(v => `
    <div class="var-card" style="display:flex; align-items:center; gap:6px; padding:6px 10px;">
      <span style="color:var(--text3); font-family:var(--mono);">var</span>
      <input class="var-input" value="${v.name}" onchange="renameVar('${v.id}', this.value)">
      <span style="color:var(--text3);">=</span>
      <input class="var-input var-val" value="${v.val}" onchange="updateVarVal('${v.id}', this.value)">
      <button class="btn-del btn" onclick="deleteVar('${v.id}')">✕</button>
    </div>`).join('');
}
function addVariable() {
  variables.push({ id: uid(), name: 'var_' + (variables.length + 1), val: '0' });
  renderVariables(); renderSteps(); refreshCode();
}
function renameVar(vid, val) {
  const v = variables.find(x => x.id === vid);
  if (v) { v.name = val.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_]/g, ''); refreshCode(); renderSteps(); }
}
function updateVarVal(vid, val) {
  const v = variables.find(x => x.id === vid);
  if (v) { v.val = val; refreshCode(); }
}
function deleteVar(vid) {
  variables = variables.filter(x => x.id !== vid);
  steps = steps.filter(s => s.varId !== vid);
  renderVariables(); renderSteps(); refreshCode();
}

function toggleCfg() {
  cfgOpen = !cfgOpen;
  document.getElementById('cfg-body').style.display = cfgOpen ? '' : 'none';
  document.getElementById('cfg-toggle').textContent = cfgOpen ? '▼' : '▶';
}
function g(id) { return parseFloat(document.getElementById(id).value) || 0; }

// ══ STEPS ═══════════════════════════════════════════════
const TYPE_LABEL = {
  movej: 'Move Joint', movel: 'Move Linear', movec: 'Move Arc',
  open_gripper: 'Open gripper', close_gripper: 'Close gripper', activate_gripper: 'Activate gripper',
  loop_start: 'Loop Start', if_di: 'If Digital In', end_block: 'End Block',
  wait_di: 'Wait I/O', set_do: 'Set I/O', assign_var: 'Set Var',
  sleep: 'Sleep', comment: 'Comment', textmsg: 'Log msg', popup: 'Popup msg', set_payload: 'Set Payload'
};

const TYPE_TAG = {
  movej: ['MOVE', 'tag-move'], movel: ['MOVE', 'tag-move'], movec: ['MOVE', 'tag-move'],
  open_gripper: ['GRIP', 'tag-grip'], close_gripper: ['GRIP', 'tag-grip'], activate_gripper: ['GRIP', 'tag-grip'],
  loop_start: ['FLOW', 'tag-flow'], if_di: ['FLOW', 'tag-flow'], end_block: ['END', 'tag-flow'],
  wait_di: ['I/O', 'tag-io'], set_do: ['I/O', 'tag-io'], assign_var: ['VAR', 'tag-var'],
  sleep: ['UTIL', 'tag-util'], comment: ['#', 'tag-util'], textmsg: ['LOG', 'tag-util'], popup: ['POP', 'tag-util'], set_payload: ['CFG', 'tag-util']
};

function renderSteps() {
  const list = document.getElementById('steps-list');
  
  if (steps.length === 0) {
    list.innerHTML = `<div style="text-align:center; padding: 30px; color: var(--text3); font-style: italic;">Program is empty. Add a step below or load a template above.</div>`;
    document.getElementById('step-count').textContent = '0 steps';
    return;
  }

  let depth = 0;
  list.innerHTML = steps.map((s, si) => {
    if (s.type === 'end_block') depth = Math.max(0, depth - 1);
    const [tag, tagClass] = TYPE_TAG[s.type];
    const typeOpts = Object.entries(TYPE_LABEL).map(([v, l]) => `<option value="${v}" ${s.type === v ? 'selected' : ''}>${l}</option>`).join('');

    let param = '<span class="step-spacer"></span>';
    
    // Safety check for empty positions
    const posOpts = (selId) => {
      if (positions.length === 0) return `<option value="">-- No Positions --</option>`;
      return positions.map(p => `<option value="${p.id}" ${selId === p.id ? 'selected' : ''}>${p.name}</option>`).join('');
    };
    
    const varOpts = (selId) => {
      if (variables.length === 0) return `<option value="">-- No Variables --</option>`;
      return variables.map(v => `<option value="${v.id}" ${selId === v.id ? 'selected' : ''}>${v.name}</option>`).join('');
    };

    if (s.type === 'movej' || s.type === 'movel') {
      param = `<select class="step-sel" onchange="updateStepProp('${s.id}','pid',this.value)">${posOpts(s.pid)}</select><span class="step-spacer"></span>`;
    } else if (s.type === 'movec') {
      param = `<span class="step-label">Via:</span><select class="step-sel" onchange="updateStepProp('${s.id}','pid',this.value)">${posOpts(s.pid)}</select>
               <span class="step-label" style="margin-left:4px">End:</span><select class="step-sel" onchange="updateStepProp('${s.id}','pid2',this.value)">${posOpts(s.pid2)}</select><span class="step-spacer"></span>`;
    } else if (s.type === 'sleep') {
      param = `<input class="step-input" type="number" min="0" step="0.1" value="${s.sec ?? 1}" style="width:50px" onchange="updateStepProp('${s.id}','sec',this.value)">
               <span class="step-label" style="margin-left:2px">sec</span><span class="step-spacer"></span>`;
    } else if (s.type === 'set_payload') {
      param = `<input class="step-input" type="number" min="0" step="0.1" value="${s.mass ?? 1}" style="width:50px" onchange="updateStepProp('${s.id}','mass',this.value)">
               <span class="step-label" style="margin-left:2px">kg</span><span class="step-spacer"></span>`;
    } else if (['textmsg', 'popup', 'comment'].includes(s.type)) {
      param = `<input class="step-input" type="text" value="${esc(s.msg ?? '')}" style="flex:1" placeholder="..." onchange="updateStepProp('${s.id}','msg',this.value)">`;
    } else if (s.type === 'loop_start') {
      param = `<span class="step-label">Repeat</span><input class="step-input" type="number" min="1" step="1" value="${s.iters ?? 3}" style="width:50px" onchange="updateStepProp('${s.id}','iters',this.value)">
               <span class="step-label">times</span><span class="step-spacer"></span>`;
    } else if (s.type === 'if_di' || s.type === 'wait_di') {
      param = `<span class="step-label">DI</span><input class="step-input" type="number" min="0" max="7" value="${s.pin ?? 0}" style="width:40px" onchange="updateStepProp('${s.id}','pin',this.value)">
               <span class="step-label">${s.type === 'wait_di' ? 'until' : 'is'}</span>
               <select class="step-sel" onchange="updateStepProp('${s.id}','state',this.value)">
                 <option value="True" ${s.state === 'True' ? 'selected' : ''}>High</option><option value="False" ${s.state === 'False' ? 'selected' : ''}>Low</option>
               </select><span class="step-spacer"></span>`;
    } else if (s.type === 'set_do') {
      param = `<span class="step-label">DO</span><input class="step-input" type="number" min="0" max="7" value="${s.pin ?? 0}" style="width:40px" onchange="updateStepProp('${s.id}','pin',this.value)">
               <span class="step-label">to</span>
               <select class="step-sel" onchange="updateStepProp('${s.id}','state',this.value)">
                 <option value="True" ${s.state === 'True' ? 'selected' : ''}>High</option><option value="False" ${s.state === 'False' ? 'selected' : ''}>Low</option>
               </select><span class="step-spacer"></span>`;
    } else if (s.type === 'assign_var') {
      param = `<select class="step-sel" onchange="updateStepProp('${s.id}','varId',this.value)">${varOpts(s.varId)}</select>
               <span class="step-label">=</span><input class="step-input" type="text" value="${esc(s.expr ?? '')}" style="flex:1" onchange="updateStepProp('${s.id}','expr',this.value)">`;
    } else if (s.type === 'end_block') {
      param = `<span class="step-label" style="font-style:italic;">Closes previous loop or if</span><span class="step-spacer"></span>`;
    }

    const margin = depth * 22;
    if (s.type === 'loop_start' || s.type === 'if_di') depth++;

    return `
    <div class="step ${s.type === 'end_block' ? 'block-end' : ''}" id="st-${s.id}" style="margin-left: ${margin}px;">
      <span class="step-n">${si + 1}</span>
      <span class="step-tag ${tagClass}">${tag}</span>
      <select class="step-sel" onchange="updateStepType('${s.id}',this.value)" style="width:115px">${typeOpts}</select>
      ${param}
      <button class="btn-ghost btn" onclick="moveStep('${s.id}',-1)" ${si===0?'disabled':''}>↑</button>
      <button class="btn-ghost btn" onclick="moveStep('${s.id}',1)"  ${si===steps.length-1?'disabled':''}>↓</button>
      <button class="btn-del btn"   onclick="deleteStep('${s.id}')">✕</button>
    </div>`;
  }).join('');

  document.getElementById('step-count').textContent = steps.length + ' step' + (steps.length !== 1 ? 's' : '');
}

function addStep() {
  const type = document.getElementById('new-type').value;
  const s = { id: uid(), type };
  initStepDefaults(s);
  steps.push(s);
  renderSteps(); refreshCode();
  
  const list = document.getElementById('steps-list');
  list.scrollTop = list.scrollHeight;
}

function initStepDefaults(s) {
  if (['movej', 'movel', 'movec'].includes(s.type)) s.pid = positions[0]?.id ?? null;
  if (s.type === 'movec') s.pid2 = positions[1]?.id ?? positions[0]?.id ?? null;
  if (s.type === 'sleep') s.sec = 1;
  if (['textmsg', 'popup', 'comment'].includes(s.type)) s.msg = '';
  if (s.type === 'set_payload') s.mass = 1;
  if (s.type === 'loop_start') s.iters = 3;
  if (['if_di', 'wait_di', 'set_do'].includes(s.type)) { s.pin = 0; s.state = 'True'; }
  if (s.type === 'assign_var') { s.varId = variables[0]?.id ?? null; s.expr = '0'; }
}

function deleteStep(sid) { steps = steps.filter(s => s.id !== sid); renderSteps(); refreshCode(); }
function moveStep(sid, dir) {
  const i = steps.findIndex(s => s.id === sid); const j = i + dir;
  if (j < 0 || j >= steps.length) return;
  [steps[i], steps[j]] = [steps[j], steps[i]];
  renderSteps(); refreshCode();
}
function updateStepType(sid, type) {
  const s = steps.find(x => x.id === sid); if (!s) return;
  s.type = type; initStepDefaults(s); renderSteps(); refreshCode();
}
function updateStepProp(sid, prop, val) {
  const s = steps.find(x => x.id === sid);
  if (s) { if (['sec', 'mass', 'iters', 'pin'].includes(prop)) s[prop] = parseFloat(val); else s[prop] = val; refreshCode(); }
}

function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ══ CODE GENERATION ═════════════════════════════════════
function buildCode() {
  const T = '  ';
  const jspeed = g('cfg-jspeed'), jaccel = g('cfg-jaccel');
  const L = [];

  L.push('# =================================================================');
  L.push('# UR3e Program — Generated by UR3e Program Builder V3');
  L.push('# =================================================================');
  L.push('');
  
  if (variables.length > 0) {
    L.push('# Global Variables');
    variables.forEach(v => L.push(`global ${v.name} = ${v.val || '0'}`));
    L.push('');
  }

  L.push('# Motion parameters');
  L.push(`JOINT_SPEED = ${jspeed}`);
  L.push(`JOINT_ACCEL = ${jaccel}`);
  L.push('');
  L.push('# Gripper parameters');
  L.push(`GRIPPER_SPEED    = ${g('cfg-gspeed')}`);
  L.push(`GRIPPER_FORCE    = ${g('cfg-gforce')}`);
  L.push(`GRIPPER_OPEN_MM  = ${g('cfg-gopen')}`);
  L.push(`GRIPPER_CLOSE_MM = ${g('cfg-gclose')}`);
  L.push('');
  
  if (positions.length > 0) {
    L.push('# Positions (radians)');
    positions.forEach(pos => { const vals = pos.j.map(v => v.toFixed(4)).join(', '); L.push(`${pos.name} = [${vals}]`); });
    L.push('');
  }

  L.push('# =================================================================');
  L.push('# Gripper functions');
  L.push('# =================================================================');
  L.push('');
  L.push('def activate_gripper():\n  textmsg("Activating gripper...")\n  rq_activate_and_wait()\nend\n');
  L.push('def open_gripper():\n  rq_set_speed_norm(GRIPPER_SPEED)\n  rq_set_force_norm(GRIPPER_FORCE)\n  rq_move_and_wait_norm(GRIPPER_OPEN_MM)\nend\n');
  L.push('def close_gripper():\n  rq_set_speed_norm(GRIPPER_SPEED)\n  rq_set_force_norm(GRIPPER_FORCE)\n  rq_move_and_wait_norm(GRIPPER_CLOSE_MM)\nend\n');
  L.push('# =================================================================');
  L.push('# Main program');
  L.push('# =================================================================');
  L.push('');
  L.push('def main():');
  
  let indent = 1;
  let blockStack = [];
  let loopCounter = 0;

  const getP = (pid) => { const p = positions.find(x => x.id === pid); return p ? p.name : 'UNKNOWN_POS'; };
  const getV = (vid) => { const v = variables.find(x => x.id === vid); return v ? v.name : 'unknown_var'; };

  if (steps.length === 0) {
    L.push(`${T}# No program steps defined.`);
    L.push(`${T}pass`);
  }

  steps.forEach(s => {
    const iT = T.repeat(indent);
    if (s.type === 'movej') { L.push(`${iT}movej(${getP(s.pid)}, a=JOINT_ACCEL, v=JOINT_SPEED)`); }
    else if (s.type === 'movel') { L.push(`${iT}movel(${getP(s.pid)}, a=JOINT_ACCEL, v=JOINT_SPEED)`); }
    else if (s.type === 'movec') { L.push(`${iT}movec(${getP(s.pid)}, ${getP(s.pid2)}, a=JOINT_ACCEL, v=JOINT_SPEED)`); }
    else if (s.type === 'set_payload') { L.push(`${iT}set_payload(${s.mass})`); }
    else if (s.type === 'open_gripper')  { L.push(`${iT}open_gripper()`); }
    else if (s.type === 'close_gripper') { L.push(`${iT}close_gripper()`); }
    else if (s.type === 'activate_gripper'){ L.push(`${iT}activate_gripper()`); }
    else if (s.type === 'sleep')         { L.push(`${iT}sleep(${s.sec})`); }
    else if (s.type === 'comment')       { L.push(`${iT}# ${s.msg ?? ''}`); }
    else if (s.type === 'textmsg')       { L.push(`${iT}textmsg("${s.msg ?? ''}")`); }
    else if (s.type === 'popup')         { L.push(`${iT}popup("${s.msg ?? ''}")`); }
    else if (s.type === 'wait_di')       { L.push(`${iT}while (get_standard_digital_in(${s.pin}) != ${s.state}):\n${iT}${T}sync()\n${iT}end`); }
    else if (s.type === 'set_do')        { L.push(`${iT}set_standard_digital_out(${s.pin}, ${s.state})`); }
    else if (s.type === 'assign_var')    { L.push(`${iT}${getV(s.varId)} = ${s.expr || '0'}`); }
    else if (s.type === 'loop_start') {
      loopCounter++; const v = 'loop_' + loopCounter;
      L.push(`${iT}${v} = 0\n${iT}while (${v} < ${s.iters}):`);
      indent++; blockStack.push({ type: 'loop', var: v });
    }
    else if (s.type === 'if_di') {
      L.push(`${iT}if (get_standard_digital_in(${s.pin}) == ${s.state}):`);
      indent++; blockStack.push({ type: 'if' });
    }
    else if (s.type === 'end_block') {
      const b = blockStack.pop();
      if (b && b.type === 'loop') { L.push(`${iT}${b.var} = ${b.var} + 1`); }
      indent = Math.max(1, indent - 1);
      L.push(`${T.repeat(indent)}end`);
    }
  });

  while (indent > 1) {
    const b = blockStack.pop();
    if (b && b.type === 'loop') { L.push(`${T.repeat(indent)}${b.var} = ${b.var} + 1`); }
    indent--; L.push(`${T.repeat(indent)}end`);
  }

  L.push('end\n\nmain()');
  return L.join('\n');
}

// ── Syntax highlighter ──────────────────────────────────
const KW  = /\b(def|end|if|else|while|global|pass|return|True|False|not|and|or)\b/g;
const FNS = /\b(movej|movel|movec|sleep|sync|textmsg|popup|set_payload|get_standard_digital_in|set_standard_digital_out|rq_activate_and_wait|rq_set_speed_norm|rq_set_force_norm|rq_move_and_wait_norm|rq_move_and_wait|open_gripper|close_gripper|activate_gripper|main)\b/g;
const NUM = /\b(\d+\.?\d*)\b/g;

function highlight(code) {
  return code.split('\n').map(line => {
    const e = esc(line);
    if (/^\s*#/.test(e)) return `<span class="c-cm">${e}</span>`;
    let code2 = e, comment = '';
    const ci = e.indexOf('#');
    if (ci > 0) { code2 = e.slice(0, ci); comment = e.slice(ci); }
    
    const strMap = {}; let si = 0;
    code2 = code2.replace(/"([^"]*)"/g, (_, inner) => {
      const key = `\x00S${si++}\x00`; strMap[key] = `<span class="c-str">"${inner}"</span>`; return key;
    });

    code2 = code2.replace(NUM, (m, n) => `<span class="c-num">${n}</span>`)
                 .replace(KW,  m => `<span class="c-kw">${m}</span>`)
                 .replace(FNS, m => `<span class="c-fn">${m}</span>`);

    Object.entries(strMap).forEach(([k, v]) => { code2 = code2.replace(k, v); });
    if (comment) code2 += `<span class="c-cm">${comment}</span>`;
    return code2;
  }).join('\n');
}

function refreshCode() {
  const plain = buildCode();
  document.getElementById('code-out').innerHTML = highlight(plain);
  document.getElementById('code-lines').textContent = plain.split('\n').length + ' lines';
}

function copyCode() {
  navigator.clipboard.writeText(buildCode()).then(() => {
    const b = document.querySelector('.hdr .btn');
    const orig = b.textContent; b.textContent = '✓ Copied!'; setTimeout(() => b.textContent = orig, 1800);
  });
}

function downloadCode() {
  const blob = new Blob([buildCode()], { type: 'text/plain' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'ur3e_program.script'; a.click(); URL.revokeObjectURL(a.href);
}

// ══ BOOT ════════════════════════════════════════════════
renderPositions(); renderVariables(); renderSteps(); refreshCode();
</script>
